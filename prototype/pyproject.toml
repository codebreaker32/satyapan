[project]
name = "satyapan"
version = "0.1.0"
description = "Satyapan: verify the instruction, not the pixels. Bank-side verification of 'official' communications behind flagged transfers."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "cryptography>=42",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10",
  "imagehash>=4.3",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
# speech-to-text; brings PyAV, which also decodes audio for the detector (`satyapan setup-models` fetches the model)
stt = ["faster-whisper>=1.0", "av<19"]  # av 19 dropped an open() option faster-whisper 1.2 passes
# OCR needs the tesseract program too (Windows: winget install -e --id UB-Mannheim.TesseractOCR); pymupdf reads PDFs
ocr = ["pytesseract>=0.3", "pymupdf>=1.24"]
# AASIST-L audio anti-spoofing; install torch from the CPU index: pip install torch --index-url https://download.pytorch.org/whl/cpu
audio = ["torch>=2.2", "numpy>=1.26", "av>=12,<19"]
# meaning-level campaign memory (multilingual sentence embeddings over ONNX, no torch needed)
similarity = ["fastembed>=0.4"]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: fastapi.testclient needs it

[project.scripts]
satyapan = "satyapan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["satyapan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# From the repo root the satyapan/ project dir shadows the installed package as a
# namespace package; putting this dir first on sys.path keeps the real package winning.
pythonpath = ["."]
