  - id: R-BANK-NEVER-MOVE-FD
    family: F1
    severity: hard
    title: The bank never asks you to move money to a “safe account”
    reason_en: "{bank} never asks you to break an FD or move money to another account to keep it safe. That instruction does not come from us."
    reason_hi: "{bank} आपसे कभी नहीं कहता कि FD तोड़ दें या पैसा किसी “सुरक्षित खाते” में भेज दें। यह निर्देश हमारी ओर से नहीं है।"
    citation:
      source: "Demo Bank customer notice on safe-account scams (bank policy document, data/mocks/bank_policy.md)"
