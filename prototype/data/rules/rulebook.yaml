# Satyapan rulebook. Every rule carries a primary citation, the date we checked it, a unit test and sign-off.
# A rule whose citation is not `verified: true` is demoted to soft at load time, so it can never anchor a RED.
# Reason strings are what the customer hears. They must never say "fake", "genuine" or "fraud" (tests enforce this).
version: "1.7"
bank_name: "Demo Bank"

rules:
  # ---------------- F1: issuer rulebook ----------------
  - id: R-AGENCY-PAY
    family: F1
    severity: hard
    # "A state authority", not "a law-enforcement agency", since 19 Oct: the issuer set is LAW_ENFORCEMENT, which
    # holds the telecom department as well as ED, CBI, the police and Customs, and a regulator is not law
    # enforcement. The title is what the band, the fusion explanation and the signed pack print.
    # The open-set body (Issuer.OTHER) was briefly in this rule's issuer set on 19 Oct and is now R-STATE-NAME-PAY
    # below: this rule's sentence asserts what the sender claims to be, and that is only safe to say about a body
    # the message names in so many words. See CLAIMED_STATE_AUTHORITY in models.py for the partition.
    title: A state authority demands a payment
    reason_en: "There is no “digital arrest” in Indian law, and no government agency demands money on a call. This message claims to be {issuer_en} and asks for {instruction_en}."
    reason_hi: "भारतीय क़ानून में “डिजिटल अरेस्ट” जैसा कुछ नहीं है, और कोई सरकारी एजेंसी कॉल पर पैसे नहीं माँगती। यह संदेश {issuer_hi} होने का दावा करता है और {instruction_hi} कह रहा है।"
    citation:
      source: "I4C advisory TAU/ADV/003, 6 Mar 2025; PM's Mann Ki Baat, 27 Oct 2024 (PIB PRID 2068606)"
      url: "https://cybercrime.gov.in/Webform/theme/resources/advisories/ADVISORYTAU-ADV-003DigitalArrest06.03.2025.pdf"
      quote: "There is no concept of Digital Arrest under any Indian Laws."
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_agency_pay

  - id: R-STATE-NAME-PAY
    family: F1
    severity: hard
    # The open-set half of CLAIMED_STATE_AUTHORITY: a body in masthead or self-claim position whose head noun
    # places it in the state (Bureau, Directorate, Commission, Authority, and Department / Board / Cell / Unit
    # with a state-vocabulary marker) and which the Issuer enum does not name.
    #
    # The sentence below is the whole point of the rule being separate. The open-set net reads the FORM of a
    # name, and the form of "Narcotics Control Bureau" is the form of "Credit Information Bureau (India)
    # Limited" and of "Acme Recovery and Fraud Investigation Unit". So this rule may not say "this message
    # claims to be a government body" — that is a statement of fact about a sender who may be an ordinary
    # company, read aloud to a frightened customer, with the matching title on the officer's band and in the
    # signed pack. It says what was READ instead: a government-sounding name, a demand for money, and a sender
    # we could not confirm. Every clause rests on a span or on our own check, and none of them accuses anyone.
    #
    # The body's own name is NOT interpolated. It is attacker-controlled text; it belongs in the quoted span the
    # officer reads beside the message, and the officer's band and coverage strip still name it there.
    # The first sentence is R-AGENCY-PAY's own second clause, word for word, because that copy is already signed
    # off against this citation and the claim has not changed. The "digital arrest" clause is deliberately NOT
    # carried over: an open-set body is as often a vendor-invoice chaser as a digital-arrest script, and a
    # sentence about arrest on a letter about an unpaid invoice is noise to a frightened listener.
    title: A government-sounding name demands a payment
    reason_en: "No government agency demands money on a call. This message carries a government-sounding name and asks for {instruction_en}. We could not confirm who sent it."
    reason_hi: "कोई सरकारी एजेंसी कॉल पर पैसे नहीं माँगती। इस संदेश पर सरकारी दफ़्तर जैसा नाम लिखा है और यह {instruction_hi} कह रहा है। यह संदेश किसने भेजा, इसकी पुष्टि हम नहीं कर सके।"
    citation:
      source: "PM's address, 115th episode of Mann Ki Baat, 27 Oct 2024 (PIB PRID 2068606)"
      url: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2068606"
      quote: "No government agency threatens you on the phone like this, neither inquires nor demands money on a video call like this."
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_state_name_pay

  - id: R-COURT-PAY
    family: F1
    severity: soft
    escalate_alone: true
    title: A court order demands a deposit
    reason_en: "Courts do not issue orders on video calls asking you to deposit money. The Supreme Court is hearing cases where such orders were shown to victims."
    reason_hi: "अदालतें वीडियो कॉल पर आदेश देकर पैसे जमा करने को नहीं कहतीं। सुप्रीम कोर्ट ऐसे आदेश दिखाकर पैसे माँगने के मामलों की सुनवाई कर रहा है।"
    citation:
      source: "Supreme Court of India, SMW(Crl) No. 3/2025, order of 17 Oct 2025"
      url: "https://api.sci.gov.in/supremecourt/2025/59769/59769_2025_2_7_65003_Order_17-Oct-2025.pdf"
      quote: "In Re: Victims of Digital Arrest Related to Forged Documents"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_court_pay_is_soft

  - id: R-ED-SUMMONS-NOTFOUND
    family: F1
    severity: hard
    title: Summons number and passcode not found in ED's system
    reason_en: "A summons from ED's system can be checked on ED's website with its summons number and passcode. This one ({summons_no}) was not found there."
    reason_hi: "ED के सिस्टम से जारी समन को समन नंबर और पासकोड से ED की वेबसाइट पर जाँचा जा सकता है। यह समन ({summons_no}) वहाँ नहीं मिला।"
    citation:
      source: "Directorate of Enforcement, Verify Your Summon"
      url: "https://enforcementdirectorate.gov.in/verify-summon"
      quote: "Summons issued during the last 180 days can be verified."
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_ed_summons_not_found

  - id: R-ED-NO-PASSCODE
    family: F1
    severity: soft
    escalate_alone: true
    title: ED summons has no passcode
    # Customer-facing reason text is the checkable fact only. The old version carried the procedure (check it on
    # ED's website) and an instruction (confirm with ED first), which is a third thing to remember at a counter and
    # nothing she can do there. Both moved to the officer's say_next on the card, which carries ED's verify route.
    reason_en: "A summons from ED's system carries a passcode. This one has none."
    reason_hi: "ED के सिस्टम से जो समन आता है, उस पर पासकोड होता है। इस पर कोई पासकोड नहीं है।"
    citation:
      source: "Directorate of Enforcement, Verify Your Summon (procedure PDF)"
      url: "https://enforcementdirectorate.gov.in/verify-summon"
      quote: "QR code and a unique Passcode at the bottom"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_ed_no_passcode_is_amber

  - id: R-ED-WINDOW
    family: F1
    severity: soft
    escalate_alone: true
    title: ED summons outside the online verification window
    reason_en: "ED's website can check a summons only from 24 hours after it is issued, and only for 180 days. Confirm this one ({summons_no}) with ED directly before acting on it."
    reason_hi: "ED की वेबसाइट समन जारी होने के 24 घंटे बाद से 180 दिनों तक ही उसे जाँच सकती है। इस समन ({summons_no}) की पुष्टि सीधे ED से करें, उसके बाद ही कुछ करें।"
    citation:
      source: "Directorate of Enforcement, Verify Your Summon"
      url: "https://enforcementdirectorate.gov.in/verify-summon"
      quote: "Summons can be verified after 24 hours from the issuance of summons, excluding Public and Government Holidays."
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_ed_window_is_amber

  - id: R-ED-FOUND
    family: F1
    severity: info
    title: Summons found in ED's system
    reason_en: "This summons number and passcode match ED's records."
    reason_hi: "यह समन नंबर और पासकोड ED के रिकॉर्ड से मेल खाते हैं।"
    citation:
      source: "Directorate of Enforcement, Verify Your Summon"
      url: "https://enforcementdirectorate.gov.in/verify-summon"
      quote: "Summons issued during the last 180 days can be verified."
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_ed_found_is_info

  - id: R-ED-CHANNEL
    family: F1
    severity: hard
    title: ED does not demand payment over WhatsApp or video call
    reason_en: "ED sends its letters, summonses and notices by post or e-mail. It does not demand money over WhatsApp, a phone call or a video call."
    reason_hi: "ED अपने पत्र, समन और नोटिस डाक या ईमेल से भेजता है। वह व्हाट्सऐप, फ़ोन या वीडियो कॉल पर पैसे की माँग नहीं करता।"
    citation:
      source: "Directorate of Enforcement, Note on Conmen"
      url: "https://enforcementdirectorate.gov.in/media/note-on-conmen/"
      quote: "generally despatched through post or emails"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_ed_channel

  - id: R-RBI-INV
    family: F1
    severity: hard
    title: RBI gives no investment advice
    reason_en: "RBI does not run or endorse investment schemes. In its own words: “RBI does not give any such financial investment advice.”"
    reason_hi: "RBI कोई निवेश योजना नहीं चलाता और न ही उसकी सिफ़ारिश करता है। RBI के अपने शब्दों में: “RBI does not give any such financial investment advice.”"
    citation:
      source: "RBI Press Release 2024-2025/1537, 19 Nov 2024"
      url: "https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=59135"
      quote: "RBI does not give any such financial investment advice"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_rbi_inv

  - id: R-SEBI-VALID
    family: F1
    severity: soft
    title: Investment payee UPI ID is not an @valid handle
    reason_en: "SEBI-registered investment firms collect payments on UPI IDs ending in “@valid”. This ID ({vpa}) does not."
    reason_hi: "SEBI से रजिस्टर्ड निवेश कंपनियाँ “@valid” पर खत्म होने वाली UPI आईडी से ही पैसे लेती हैं। यह आईडी ({vpa}) वैसी नहीं है।"
    citation:
      source: "SEBI circular SEBI/HO/DEPA-II/DEPA-II_SRG/P/CIR/2025/86, 11 Jun 2025"
      url: "https://www.sebi.gov.in/sebi_data/attachdocs/jun-2025/1749641449497.pdf"
      quote: "it is mandatory for intermediaries to obtain and make available this structured UPI address to their investors"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_sebi_valid

  - id: R-CALLER-1600
    family: F1
    severity: soft
    title: Financial call not from the 1600 series
    # The citation is a fact about the calls a BANK places, so the reason may only be said about an artefact
    # that carries a call AND about a message claiming to be a bank. The wording here says "this call" and
    # "banks and financial firms", so a reason that reaches a card with no call in it, or about a regulator,
    # is a visible contradiction rather than a quiet one. Both have now happened in front of a judge: a pasted
    # letter (pass 5) and a pasted "RBI ALERT" SMS saying "call our helpline" (pass 6). `rules._call_number`
    # gates the channel AND the artefact kind; `rules.SERVICE_CALL_ISSUERS` holds the gate to BANK_SELF, because
    # RBI and SEBI are regulators and do not place service calls to bank customers at all.
    reason_en: "Banks and financial firms place service calls only from numbers starting 1600. This call came from {caller}, which is not one."
    reason_hi: "बैंक और वित्तीय कंपनियाँ सेवा से जुड़ी कॉल सिर्फ़ 1600 से शुरू होने वाले नंबरों से करती हैं। यह कॉल {caller} से आई है, जो वैसा नंबर नहीं है।"
    citation:
      source: "RBI circular RBI/2024-25/105, 17 Jan 2025; TRAI PR 135/2025"
      url: "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12770&Mode=0"
      quote: "1600xx"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_caller_1600

  - id: R-DOMAIN-BANKIN
    family: F1
    severity: soft
    title: Bank link not on .bank.in
    reason_en: "Indian banks' websites end in “.bank.in”. This link ({url}) does not."
    reason_hi: "भारतीय बैंकों की वेबसाइट “.bank.in” पर खत्म होती है। यह लिंक ({url}) वैसा नहीं है।"
    citation:
      source: "RBI circular RBI/2025-26/28, 22 Apr 2025"
      url: "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12837&Mode=0"
      quote: ".bank.in"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_domain_bankin

  - id: R-CHALLAN-OFFICIAL
    family: F1
    severity: soft
    escalate_alone: true
    # The e-challan SERVICE's own live notice: it never asks for payment details through calls, messages or links,
    # and its portal is the only place to use. The rule fires only when the challan routes the payment somewhere
    # else (a link off .gov.in, an account or UPI ID, "call this number to pay"; rules._payment_route_off_site), so a
    # real challan SMS pointing at the official site does not fire it. Soft and escalating alone: AMBER, never RED,
    # on its own. The reason states the service's practice and never describes the message.
    title: A traffic challan asks for payment off the official site
    reason_en: "The government's e-challan service says it never asks for payment details through calls, messages or links. Check a traffic challan only on echallan.parivahan.gov.in before paying it."
    reason_hi: "सरकार की ई-चालान सेवा कहती है कि वह कॉल, संदेश या लिंक के ज़रिए भुगतान की जानकारी कभी नहीं माँगती। ट्रैफ़िक चालान भरने से पहले उसे सिर्फ़ echallan.parivahan.gov.in पर जाँचें।"
    citation:
      source: "Ministry of Road Transport and Highways, notice on the e-Challan portal (echallan.parivahan.gov.in)"
      url: "https://echallan.parivahan.gov.in/index/accused-challan"
      quote: "We never request your password, OTP, payment details or sensitive personal information via calls, emails, or messages or links."
      checked: "2026-10-23"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_challan_official_is_amber_alone

  - id: R-DOMAIN-GOVIN
    family: F1
    severity: soft
    # The government counterpart of R-DOMAIN-BANKIN, and soft like it: a few real civic bodies still run on other
    # domains, so it flags and never anchors. It runs only for a message in a government body's name or asking for
    # a government due, and never for RBI, whose own site is rbi.org.in (rules.GOVIN_SENDERS). The sentence says
    # only what the registry rules out: a .gov.in address can belong only to a government body, and this link is
    # not on .gov.in. It never says the link is not the body's.
    title: Government link not on .gov.in
    reason_en: "Only government bodies can get a web address ending in “.gov.in”. This link ({url}) does not end in it."
    reason_hi: "“.gov.in” पर खत्म होने वाला वेब पता सिर्फ़ सरकारी संस्थाओं को मिलता है। यह लिंक ({url}) उस पर खत्म नहीं होता।"
    citation:
      source: "NIC .GOV.IN domain registry, registration guidelines: eligibility for the .GOV.IN zone"
      url: "https://registry.gov.in/registration_guidelines.php"
      quote: "Eligibility for securing registration under .GOV.IN domain zone would be as follows"
      checked: "2026-10-23"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_domain_govin

  - id: R-WEBSITE-NEW
    family: F1
    severity: soft
    # The domain registry's own record of the link (RDAP), read live when online and from recorded answers when
    # not (adapters.LiveWebsiteRegistry / SnapshotWebsiteRegistry). Fires for an official-looking message whose
    # link is off .gov.in / .nic.in and was registered under a year ago, is suspended by the registry, or does not
    # exist. The sentence states the registry's facts only. Soft: a fact about a website, never an anchor.
    title: The website in the message is new, suspended or unregistered
    reason_en: "The website in this message ({host}) {finding_en}."
    reason_hi: "इस संदेश में दी गई वेबसाइट ({host}) {finding_hi}।"
    citation:
      source: "Domain registration data (RDAP) from the domain's registry, via the rdap.org bootstrap service"
      url: "https://rdap.org/"
      quote: 'RDAP.org aggregates information about all known RDAP servers. RDAP clients can send RDAP queries to RDAP.org, which will then redirect requests to the appropriate RDAP service.'
      checked: "2026-10-23"
      verified: true
    sign_off: [compliance, infosec]
    test: tests/test_rules.py::test_website_new

  - id: R-SUSPECT
    family: F1
    severity: soft
    title: Identifier already in the I4C suspect registry
    reason_en: "This {what} is already listed in the national suspect registry run by I4C."
    reason_hi: "यह {what_hi} पहले से I4C की राष्ट्रीय संदिग्ध सूची में दर्ज है।"
    citation:
