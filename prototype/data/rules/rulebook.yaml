    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_payee_name_private

  - id: R-PAYEE-NOT-SENDER
    family: F2
    severity: hard
    # R-PAYEE-NAME's sibling for a message that never says whose account it gives: a copied tax notice or a forged
    # summons just puts a number where the real one had the body's own account. The look-up is checked against the
    # body the message is in the name of (or the body a challan or a local tax is owed to), and only for a
    # government sender or a government due (rules._in_the_states_name). The first clause describes the message,
    # so the card drops it without a span (card.GROUNDED_CLAUSES); the second is the bank's own record.
    # {payee_en} / {payee_hi} are "account" or "UPI ID" (rules.PAYEE_EN / PAYEE_HI): a UPI ID in the message is looked
    # up the same way as an account.
    title: The account is not the named body's own
    reason_en: "This message is in the name of {issuer_en}, but the {payee_en} it gives is registered to “{holder}” ({holder_type_en})."
    reason_hi: "यह संदेश {issuer_hi} के नाम से है, लेकिन इसमें {payee_hi} बैंक रिकॉर्ड में “{holder}” ({holder_type_hi}) के नाम पर है।"
    citation:
      source: "RBI circular RBI/2024-25/99, 30 Dec 2024: beneficiary account name look-up for RTGS and NEFT"
      url: "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12759&Mode=0"
      quote: "beneficiary account name look-up facility"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_payee_not_sender

  - id: R-RECEIVER-NAME
    family: F2
    severity: hard
    # Reads the bank's own record of the paused transfer (the flag), never the message, so it holds against a
    # perfect copy of a real notice: the words can be copied, the receiver of the money cannot. It says nothing
    # about the message and needs no span. It runs only when the message is in a government body's name or asks
    # for a government due. The UPI path uses the same look-up adapter, labelled as a mock like the account path.
    title: The paused payment goes to a private account
    reason_en: "The payment you were making goes to “{holder}” ({holder_type_en}), not to a government account."
    reason_hi: "आप जो भुगतान कर रहे थे, वह “{holder}” ({holder_type_hi}) को जा रहा है, किसी सरकारी खाते में नहीं।"
    citation:
      source: "RBI circular RBI/2024-25/99, 30 Dec 2024: beneficiary account name look-up for RTGS and NEFT"
      url: "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12759&Mode=0"
      quote: "beneficiary account name look-up facility"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_receiver_name

