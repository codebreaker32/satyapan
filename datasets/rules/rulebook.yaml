      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_sebi_valid

  - id: R-CALLER-1600
    family: F1
    severity: soft
    title: Financial call not from the 1600 series
    # The citation is a fact about the calls a BANK places, so the reason may only be said about an artefact
    # that carries a call AND about a message claiming to be a bank. The wording here says "this call" and
    # "banks and financial firms", so a reason that reaches a card with no call in it, or about a regulator,
    # is a visible contradiction rather than a quiet one. Both have now happened in front of a judge: a pasted
    # letter (pass 5) and a pasted "RBI ALERT" SMS saying "call our helpline" (pass 6). `rules._call_number`
    # gates the channel AND the artefact kind; `rules.SERVICE_CALL_ISSUERS` holds the gate to BANK_SELF, because
    # RBI and SEBI are regulators and do not place service calls to bank customers at all.
    reason_en: "Banks and financial firms place service calls only from numbers starting 1600. This call came from {caller}, which is not one."
    reason_hi: "बैंक और वित्तीय कंपनियाँ सेवा से जुड़ी कॉल सिर्फ़ 1600 से शुरू होने वाले नंबरों से करती हैं। यह कॉल {caller} से आई है, जो वैसा नंबर नहीं है।"
    citation:
      source: "RBI circular RBI/2024-25/105, 17 Jan 2025; TRAI PR 135/2025"
      url: "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12770&Mode=0"
      quote: "1600xx"
      checked: "2026-10-05"
      verified: true
    sign_off: [compliance, legal]
    test: tests/test_rules.py::test_caller_1600

