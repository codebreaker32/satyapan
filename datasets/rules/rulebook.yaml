  # ---------------- F2: bank-truth provenance ----------------
  - id: R-BANK-SELF
    family: F2
    severity: hard
    title: Not in our outbound record
    # The reason used to end "It did not come from us", which is categorical, over a log that is not: it holds
    # what the bank sends centrally and nothing a branch hands over, posts or says at a counter. A judge pasted a
    # genuine head-office recovery letter and the card told a real customer the bank had not sent it. The scope
    # now rides in the same two sentences as the claim. {scope_en} / {scope_hi} are computed by
    # `rules._log_coverage` from the channels the log's own records carry, so the card can only name coverage the
    # record in data/mocks/outbound_log.json actually has.
    # The scope belongs to the officer, not to the customer. The first version put the computed channel list on the
    # card itself and a frightened 70-year-old was read 44 words containing "आउटबाउंड लॉग" and "IVR कॉल". The card
    # now carries the claim and the one boundary she needs to understand it; the full computed coverage rides in
    # the citation and in `detail.lookup.coverage`, which the officer's evidence panel and the signed pack show.
    reason_en: "{bank} has no record of sending this message. A letter handed over at a branch would not be in that record."
    reason_hi: "{bank} के रिकॉर्ड में ऐसा कोई संदेश नहीं है। शाखा से हाथ में दिया गया पत्र उस रिकॉर्ड में नहीं होता।"
    citation:
      source: "Bank outbound-communications log, centrally sent channels only (SMS, e-mail, IVR, official WhatsApp, in-app); branch letters, posted notices and counter conversations are outside it"
      url: "internal://outbound-log"
      quote: "message not found in centrally sent channels"
      checked: "2026-10-18"
      verified: true
    sign_off: [compliance, infosec]
    test: tests/test_rules.py::test_bank_self_not_sent

